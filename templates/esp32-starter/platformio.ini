; Environments:
;   board  : the real ESP32 (pio run -e board -t upload)
;   uno    : an Arduino Uno instead (pio run -e uno -t upload)
;   native : logic tests on the computer, no board (pio test -e native)
; Change `board =` for your exact board (see the new-project skill).
[platformio]
default_envs = board

[env]
framework = arduino
monitor_speed = 115200
test_ignore = test_logic

[env:board]
platform = espressif32@^8.0.0
board = esp32dev
monitor_filters = esp32_exception_decoder
; Native-USB boards (C3 SuperMini, XIAO, S3 on its USB port) also need:
; build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
; lib_deps = adafruit/Adafruit BME280 Library@^2.2.4   (pin versions like this)

[env:uno]
platform = atmelavr@^5.1.0
board = uno

[env:native]
platform = native
framework =
test_framework = unity
test_ignore =
build_flags = -std=c++17
